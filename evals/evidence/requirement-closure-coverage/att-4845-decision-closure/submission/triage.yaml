blockers:
  - title: "Fallback trigger"
    id: BLK-1
    decision_id: DEC-4
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "How many returned results should trigger the broadened search?"
    detail:
      state: "The empty-result case is specified, but the count that is considered too few is not."
      options:
        - "Broaden only when no results are returned."
        - "Broaden when fewer than a specified number of results are returned."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
  - title: "Fallback sequence"
    id: BLK-2
    decision_id: DEC-5
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Which visible keyword should be removed first when a seeded search is broadened?"
    detail:
      state: "The ticket requires narrowing the seed set but does not define the removal order for each feature."
      options:
        - "Use a product-defined removal order for each feature's visible keywords."
        - "Skip incremental removal and switch directly to the Default keyword set."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
