ticket: ATT-4845
title: "AA v2 | [FE] - Stock Image search should have pre-filtered results according to feature"
task_class: capability-change
disposition: BLOCKED
outcome_decidable: partial
evidence_ok: true
product_decision_open: true
design_dependency: false
backend_dependency: true
blockers:
  - title: "Confirm keyword wording"
    id: BLK-1
    decision_id: DEC-30
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "Which exact keyword list for each named feature and Default should ship for release?"
    detail:
      state: "The ticket supplies initial lists but requires Product/Design confirmation before release."
      options:
        - "Approve every listed keyword set unchanged for release."
        - "Provide the exact replacement keyword set for each feature that must change."
      evidence:
        - kind: quote
          text: "final wording should be confirmed with Product/Design before release"
          source: description
  - title: "Define configuration update path"
    id: BLK-2
    decision_id: DEC-14
    owner: product-backend
    owner_account_id: "replay-owner:product-backend"
    ask: "Who owns the keyword configuration, and where will they update it so changes reach users without a release?"
    detail:
      state: "The ticket requires no-code tuning but names neither the authoritative owner nor the runtime update mechanism."
      options:
        - "Name the owner and the existing administration or configuration surface used to publish changes."
        - "Confirm that release-based updates are acceptable and revise the no-code requirement."
      evidence:
        - kind: quote
          text: "The keyword sets are *config-driven* (a central mapping/table), not hardcoded per screen, so they can be tuned without a code change."
          source: description
  - title: "Map Fashion Videoshoot"
    id: BLK-3
    decision_id: DEC-10
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Should Fashion Videoshoot open with the Fashion Video keyword set or the Default keyword set?"
    detail:
      state: "The ticket names Fashion Video, while the application presents Fashion Videoshoot as a feature context."
      options:
        - "Fashion Videoshoot opens with the Fashion Video keywords."
        - "Fashion Videoshoot opens with the Default keywords."
      evidence:
        - kind: quote
          text: "Fashion Video"
          source: description
        - kind: file
          path: "src/app/constants/feature-meta.ts"
          line: 40
          text: "    title: 'Fashion Videoshoot',"
  - title: "Map UGC Video"
    id: BLK-4
    decision_id: DEC-11
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Should UGC Video open with the UGC keyword set or the Default keyword set?"
    detail:
      state: "The ticket names UGC, while the application presents UGC Video as a feature context."
      options:
        - "UGC Video opens with the UGC keywords."
        - "UGC Video opens with the Default keywords."
      evidence:
        - kind: quote
          text: "UGC"
          source: description
        - kind: file
          path: "src/app/constants/feature-meta.ts"
          line: 55
          text: "    title: 'UGC Video',"
  - title: "Identify Product Photo Ads"
    id: BLK-5
    decision_id: DEC-12
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Which visible application feature should receive the Product Photo Ads keyword set?"
    detail:
      state: "The ticket supplies Product Photo Ads keywords but does not identify the corresponding visible application feature."
      options:
        - "Name the visible feature that opens with the Product Photo Ads keywords."
        - "Confirm that no current feature uses this set and that it is reserved for a future feature."
      evidence:
        - kind: quote
          text: "Product Photo Ads"
          source: description
  - title: "Define composable relevance"
    id: BLK-6
    decision_id: DEC-22
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "What measurable result rule determines whether surfaced visuals are composable with the user's asset?"
    detail:
      state: "The required relevance quality is qualitative and has no pass/fail boundary."
      options:
        - "Provide a measurable relevance target and how it will be evaluated."
        - "Remove this as a release acceptance condition and retain the explicit keyword behavior only."
      evidence:
        - kind: quote
          text: "Results should surface visuals that are *composable with the user's own asset* (e.g. props/backgrounds for a product), not just literal matches of the feature name."
          source: description
  - title: "Define result ordering"
    id: BLK-7
    decision_id: DEC-24
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "What complete ranking rule should place the most relevant and usable stock results first, including ties?"
    detail:
      state: "The ticket requests sensible ordering but provides no ranking precedence or tie behavior."
      options:
        - "Provide the ranked factors in precedence order and the tie rule."
        - "Accept the stock provider's existing result order without an additional product rule."
      evidence:
        - kind: quote
          text: "Sensible ordering: most relevant / most usable results first."
          source: description
  - title: "Set few-results threshold"
    id: BLK-8
    decision_id: DEC-25
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "How many returned results count as very few and trigger query broadening?"
    detail:
      state: "The fallback trigger has no numeric boundary or inclusive rule."
      options:
        - "Provide the exact count and confirm whether that count itself triggers broadening."
        - "Trigger broadening only when the seeded query returns zero results."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
  - title: "Order fallback removals"
    id: BLK-9
    decision_id: DEC-26
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "In what exact order should seed keywords be removed before the search falls back to Default?"
    detail:
      state: "The ticket says to drop the narrowest keywords but does not identify them or define the removal order."
      options:
        - "Provide one ordered removal sequence for every named keyword set."
        - "Skip incremental removal and move directly from the full feature set to Default."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
