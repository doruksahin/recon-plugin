recon: triage
ticket: ATT-4845
title: "AA v2 | [FE] - Stock Image search should have pre-filtered results according to feature"
task_class: capability-change
disposition: BLOCKED
outcome_decidable: true
evidence_ok: true
product_decision_open: true
design_dependency: false
backend_dependency: false
blockers:
  - title: "Broadening threshold"
    id: BLK-1
    decision_id: DEC-1
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "When a seeded search has only a small number of results, what result count should trigger broader results?"
    detail:
      state: "The ticket requires broader results when there are \"very few\" results but does not define a result count."
      options:
        - "Broaden the displayed results when fewer than 10 images are returned."
        - "Broaden the displayed results only when no images are returned."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
  - title: "Keyword removal order"
    id: BLK-2
    decision_id: DEC-2
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Which seed keyword should be removed first when the search needs broader results?"
    detail:
      state: "The ticket says to remove the narrowest keywords first but does not order each feature's seed keywords by breadth."
      options:
        - "Broaden results by removing the last seed keyword shown for the feature first."
        - "Broaden results by removing the first seed keyword shown for the feature first."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
conflicts: []
