recon: triage
ticket: ATT-4845
title: "AA v2 | [FE] - Stock Image search should have pre-filtered results according to feature"
task_class: capability-change
disposition: BLOCKED
outcome_decidable: partial
evidence_ok: true
product_decision_open: true
design_dependency: false
backend_dependency: true
blockers:
  - title: "Product Ads identity"
    id: BLK-1
    decision_id: DEC-10
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Which current feature should receive the Product Photo Ads keyword set?"
    detail:
      state: "The ticket names Product Photo Ads, while the current product presents differently named advertising features."
      options:
        - "High Impact CTA Layout receives the Product Photo Ads keywords."
        - "AI Driven Ads/Posts receives the Product Photo Ads keywords."
        - "A separately named current feature receives the Product Photo Ads keywords."
      evidence:
        - kind: quote
          text: "|*Product Photo Ads*|lifestyle scene, environment, context background, surface, in-use, real setting|"
          source: description
  - title: "Configuration update path"
    id: BLK-2
    decision_id: DEC-14
    owner: product-backend
    owner_account_id: "replay-owner:product-backend"
    ask: "Where should authorized teams update keyword sets without releasing new application code?"
    detail:
      state: "The ticket requires a central mapping that can be tuned without a code release but does not name its owner or delivery mechanism."
      options:
        - "Authorized users edit the sets in an administrative product setting."
        - "A remotely delivered configuration supplies the sets to the application."
        - "Another named owner and delivery mechanism supplies the sets."
      evidence:
        - kind: quote
          text: "* *AC1.2* The keyword sets are *config-driven* (a central mapping/table), not hardcoded per screen, so they can be tuned without a code change."
          source: description
  - title: "Relevance acceptance rule"
    id: BLK-3
    decision_id: DEC-21
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "What observable result set will qualify each feature's pre-filter as composable and relevant?"
    detail:
      state: "Composable and relevant are required outcomes, but the ticket gives examples rather than a pass/fail boundary."
      options:
        - "Approve a fixed example result set for each named feature."
        - "Define required visual categories and the minimum share of returned results that must match them."
        - "Limit acceptance to showing and sending the specified seed keywords."
      evidence:
        - kind: quote
          text: "* *AC4.1* Results should surface visuals that are *composable with the user's own asset* (e.g. props/backgrounds for a product), not just literal matches of the feature name."
          source: description
  - title: "Result ranking rule"
    id: BLK-4
    decision_id: DEC-23
    owner: product-backend
    owner_account_id: "replay-owner:product-backend"
    ask: "Should results keep the stock provider's order or follow a product-defined ranking with stated tie behavior?"
    detail:
      state: "The ticket requires most relevant and most usable results first but does not select a ranking, precedence, or tie rule."
      options:
        - "Keep the stock provider's returned order, including its tie behavior."
        - "Define a product ranking and a deterministic tie rule."
      evidence:
        - kind: quote
          text: "* *AC4.3* Sensible ordering: most relevant / most usable results first."
          source: description
  - title: "Few results boundary"
    id: BLK-5
    decision_id: DEC-24
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "At what returned-result count should the search broaden, and does that boundary count as few?"
    detail:
      state: "The broadening trigger says very few results without a count or inclusive boundary."
      options:
        - "Broaden below a specified count but not at that count."
        - "Broaden at or below a specified count."
      evidence:
        - kind: quote
          text: "* *AC5.1* If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
  - title: "Keyword removal order"
    id: BLK-6
    decision_id: DEC-25
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "For each keyword set, which keyword is removed first, next, and on ties before Default is used?"
    detail:
      state: "The fallback requires dropping the narrowest keywords but supplies no total removal order or tie behavior."
      options:
        - "Provide an ordered removal list for every named keyword set."
        - "Remove all feature-specific keywords together and use Default on the next attempt."
      evidence:
        - kind: quote
          text: "* *AC5.1* If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
conflicts: []
