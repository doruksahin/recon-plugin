recon: triage
ticket: ATT-4845
title: "AA v2 | [FE] - Stock Image search should have pre-filtered results according to feature"
task_class: capability-change
disposition: BLOCKED
outcome_decidable: partial
evidence_ok: true
product_decision_open: true
design_dependency: false
backend_dependency: true
blockers:
  - title: "Approve keyword wording"
    id: BLK-1
    decision_id: DEC-1
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "Should the listed initial keyword sets ship unchanged, or will Product and Design provide replacement wording before release?"
    detail:
      state: "The ticket requires the listed values to be implemented but also leaves their release wording unconfirmed."
      options:
        - "Approve every listed keyword set unchanged for release."
        - "Provide the replacement words for each affected feature before release."
      evidence:
        - kind: quote
          text: "The keyword lists above are the initial values to implement; final wording should be confirmed with Product/Design before release, but the mechanism and a populated set (including Default) must ship."
          source: description
  - title: "Map Fashion Video"
    id: BLK-2
    decision_id: DEC-9
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Should Fashion Videoshoot use the Fashion Video keyword set?"
    detail:
      state: "The ticket names Fashion Video while the available feature is presented to users as Fashion Videoshoot."
      options:
        - "Fashion Videoshoot opens with the Fashion Video keywords."
        - "Fashion Videoshoot opens with the Default keywords."
      evidence:
        - kind: quote
          text: "|*Fashion Video*|fashion model, runway, catwalk, studio, street style, motion, editorial, backdrop|"
          source: description
        - kind: file
          path: "src/app/constants/feature-meta.ts"
          line: 40
          text: "    title: 'Fashion Videoshoot',"
  - title: "Map UGC Video"
    id: BLK-3
    decision_id: DEC-10
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Should UGC Video use the UGC keyword set?"
    detail:
      state: "The ticket names UGC while the available feature is presented to users as UGC Video."
      options:
        - "UGC Video opens with the UGC keywords."
        - "UGC Video opens with the Default keywords."
      evidence:
        - kind: quote
          text: "|*UGC*|lifestyle, real people, home, hands, everyday scene, candid, casual, selfie|"
          source: description
        - kind: file
          path: "src/app/constants/feature-meta.ts"
          line: 55
          text: "    title: 'UGC Video',"
  - title: "Identify Product Photo Ads"
    id: BLK-4
    decision_id: DEC-11
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Which user-facing feature should receive the Product Photo Ads keyword set?"
    detail:
      state: "The ticket defines Product Photo Ads keywords, but no available feature uses that exact user-facing name."
      options:
        - "AI Driven Ads/Posts opens with the Product Photo Ads keywords."
        - "High Impact CTA Layout opens with the Product Photo Ads keywords."
        - "Neither current feature uses this set; name the intended feature."
      evidence:
        - kind: quote
          text: "|*Product Photo Ads*|lifestyle scene, environment, context background, surface, in-use, real setting|"
          source: description
        - kind: file
          path: "src/app/constants/feature-meta.ts"
          line: 60
          text: "    title: 'High Impact CTA Layout',"
        - kind: file
          path: "src/app/constants/feature-meta.ts"
          line: 75
          text: "    title: 'AI Driven Ads/Posts',"
  - title: "Choose configuration path"
    id: BLK-5
    decision_id: DEC-22
    owner: product-backend
    owner_account_id: "replay-owner:product-backend"
    ask: "Who owns keyword changes, and where will they update them so new searches use the changes without a deployment?"
    detail:
      state: "The ticket requires no-code tuning but names neither an authoritative owner nor an operational update location."
      options:
        - "Authorized operators edit a managed setting and subsequent searches use the new values."
        - "The service supplies the current values and Product requests changes through the service owner."
        - "Provide another owner and no-deployment update workflow."
      evidence:
        - kind: quote
          text: "The keyword sets are *config-driven* (a central mapping/table), not hardcoded per screen, so they can be tuned without a code change."
          source: description
  - title: "Define session persistence"
    id: BLK-6
    decision_id: DEC-28
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "How long should edited keywords persist when a user closes and later reopens search in the same feature?"
    detail:
      state: "The ticket says keywords persist for the session but does not define the session boundary."
      options:
        - "They persist across close and reopen until the user changes feature or leaves the creation page."
        - "They persist across navigation until the browser tab is closed, unless the feature changes."
        - "They reset whenever the search window closes."
      evidence:
        - kind: quote
          text: "The seeded keywords/chips persist for the session within that feature, and reset when the feature/context changes."
          source: description
  - title: "Define relevance acceptance"
    id: BLK-7
    decision_id: DEC-30
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "What observable result standard determines that the returned visuals are composable with the user's asset?"
    detail:
      state: "The ticket requires composable visuals but supplies examples rather than a pass-or-fail acceptance rule."
      options:
        - "Product and Design approve a documented review set for every named feature."
        - "Define how many of the first displayed results must be usable and the review examples for each feature."
      evidence:
        - kind: quote
          text: "Results should surface visuals that are *composable with the user's own asset* (e.g. props/backgrounds for a product), not just literal matches of the feature name."
          source: description
  - title: "Define result ordering"
    id: BLK-8
    decision_id: DEC-32
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "What complete ordering should users see, including equal-relevance results and items that match more than one keyword?"
    detail:
      state: "The ticket asks for the most relevant and usable results first without selecting a total ordering rule."
      options:
        - "Keep the stock source's returned order for the combined seeded search."
        - "Group results by the listed keyword priority and define how ties are ordered."
        - "Provide another complete visible ordering rule."
      evidence:
        - kind: quote
          text: "Sensible ordering: most relevant / most usable results first."
          source: description
  - title: "Set sparse result threshold"
    id: BLK-9
    decision_id: DEC-33
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "How many returned results counts as very few and triggers automatic broadening?"
    detail:
      state: "The fallback trigger has no result-count unit, boundary, or behavior at the boundary."
      options:
        - "Provide one result-count threshold and broaden when the count is at or below it."
        - "Provide one result-count threshold and broaden only when the count is below it."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
  - title: "Order keyword broadening"
    id: BLK-10
    decision_id: DEC-34
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "In what exact priority should keywords be removed for each feature before the Default set is used?"
    detail:
      state: "The fallback requires dropping the narrowest keywords but does not identify them or define tie and retry order."
      options:
        - "Remove keywords from the end of each listed set, retrying after each removal, then use Default."
        - "Provide a narrowest-to-broadest removal order for every named feature, including tied terms."
        - "Broaden directly to Default after the seeded search crosses the sparse-result threshold."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
conflicts: []
