blockers:
  - title: "Fallback threshold"
    id: BLK-1
    decision_id: DEC-1
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "At what result count should the search broaden its initial keyword set?"
    detail:
      state: "The ticket requires broadening for no or very few results but does not define the result count."
      options:
        - "Broaden only when no results appear."
        - "Broaden when fewer than five results appear."
        - "Broaden when fewer than ten results appear."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
  - title: "Fallback keyword order"
    id: BLK-2
    decision_id: DEC-2
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Which initial keywords should be removed first when the search broadens?"
    detail:
      state: "The ticket says to drop the narrowest keywords but does not define an order for each feature."
      options:
        - "Keep all initial keywords until the Default results are shown."
        - "Remove the last-listed initial keyword first, then continue in reverse order."
        - "Provide a priority order for each feature's initial keywords."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
