recon: triage
ticket: ATT-4845
title: "AA v2 | [FE] - Stock Image search should have pre-filtered results according to feature"
task_class: capability-change
disposition: BLOCKED
outcome_decidable: partial
evidence_ok: true
product_decision_open: true
design_dependency: true
backend_dependency: true
blockers:
  - title: "Context keyword mapping"
    id: BLK-1
    decision_id: DEC-13
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Which keyword set should each context that can open Stock Image search use, including Product Videoshoot, Storyline Video, Template Driven Ads, and AI Driven Ads/Posts?"
    detail:
      state: "The ticket names six feature contexts plus Default, while the product contains additional contexts that can open the shared Stock Image search."
      options:
        - "Map every additional context to one of the six listed feature sets."
        - "Provide a distinct keyword set for each additional context."
        - "Use the Default set for every additional context."
      evidence:
        - kind: quote
          text: "Every context that can open Stock Image search resolves to a keyword set: either the feature-specific set or the Default set. There is no path that opens with zero seed keywords."
          source: description
        - kind: file
          path: "src/app/constants/feature-meta.ts"
          line: 8
          text: "  ProductVideo = 'product-video',"
  - title: "Configuration update path"
    id: BLK-2
    decision_id: DEC-28
    owner: product-backend
    owner_account_id: "replay-owner:product-backend"
    ask: "Who owns the keyword mapping, and where will they update it so changes reach users without a software release?"
    detail:
      state: "The ticket requires a central mapping that can be tuned without a code change but does not name its authoritative source or runtime update path."
      options:
        - "Product owners edit a remotely managed mapping that the search reads when opened."
        - "Backend owners publish the mapping through an existing runtime configuration channel."
        - "Revise the requirement so a centrally defined mapping delivered with a software release is acceptable."
      evidence:
        - kind: quote
          text: "The keyword sets are *config-driven* (a central mapping/table), not hardcoded per screen, so they can be tuned without a code change."
          source: description
  - title: "Session persistence boundary"
    id: BLK-3
    decision_id: DEC-17
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "Should seeded keywords survive closing and reopening Stock Image search within the same creative, the whole browser session, or only while the search stays open?"
    detail:
      state: "The required session boundary is not defined, so persistence and reset behavior cannot have one pass/fail result."
      options:
        - "Persist only while Stock Image search remains open."
        - "Persist across reopenings within the current creative and reset when its feature changes."
        - "Persist for the whole browser session and reset whenever the feature changes."
      evidence:
        - kind: quote
          text: "The seeded keywords/chips persist for the session within that feature, and reset when the feature/context changes."
          source: description
  - title: "Cleared search result"
    id: BLK-4
    decision_id: DEC-16
    owner: product-backend
    owner_account_id: "replay-owner:product-backend"
    ask: "After all seeded keywords are removed, should users see results for the selected brand, the Default keywords, or a truly keyword-free result set?"
    detail:
      state: "The ticket says unfiltered, while the current search substitutes the selected brand and the prepared mock rejects a request with no query."
      options:
        - "Show results for the selected brand after all feature seeds are removed."
        - "Show results from the Default keyword set after all feature seeds are removed."
        - "Show a keyword-free result set and ensure that request is supported."
      evidence:
        - kind: quote
          text: "Removing all seeds returns the standard unfiltered stock search."
          source: description
        - kind: file
          path: "src/app/components/search-modal/components/search-modal/use-search-input.ts"
          line: 65
          text: "  const query = selectedLabels.length ? selectedLabels.join(',') : brandName"
        - kind: file
          path: "src/mocks/handlers/image-hub.handlers.ts"
          line: 14
          text: "      return HttpResponse.json({ message: 'Query is required.' }, { status: 400 })"
  - title: "Composable relevance rule"
    id: BLK-5
    decision_id: DEC-18
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "What pass/fail examples or measurable rule should define whether results are composable for each listed feature?"
    detail:
      state: "Composable and literal matches are described qualitatively without examples or a measurable acceptance boundary for each feature."
      options:
        - "Provide an approved set of expected and rejected example results for each feature."
        - "Provide a measurable relevance target and evaluation sample for each feature."
        - "Remove this criterion from release acceptance and treat it as a later evaluation."
      evidence:
        - kind: quote
          text: "Results should surface visuals that are *composable with the user's own asset* (e.g. props/backgrounds for a product), not just literal matches of the feature name."
          source: description
  - title: "Result ranking rule"
    id: BLK-6
    decision_id: DEC-20
    owner: product-design
    owner_account_id: "replay-owner:product-design"
    ask: "What total ranking rule should users see, including ties and results with no relevance score?"
    detail:
      state: "Most relevant and most usable do not define precedence, tie behavior, or handling for results without a ranking signal."
      options:
        - "Preserve the stock provider's returned order without additional ranking."
        - "Define a product ranking with explicit precedence and tie behavior."
        - "Remove ranking from release acceptance and measure it separately."
      evidence:
        - kind: quote
          text: "Sensible ordering: most relevant / most usable results first."
          source: description
  - title: "Broadening result threshold"
    id: BLK-7
    decision_id: DEC-21
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "How many returned results counts as very few and triggers broadening?"
    detail:
      state: "The response exposes a total result count, but the ticket does not define the numeric boundary or whether equality triggers broadening."
      options:
        - "Broaden when the total is below a specified count."
        - "Broaden when the first page contains fewer than a specified count."
        - "Broaden only when the total is zero."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
        - kind: file
          path: "src/api/models/UnifiedImageSearchResponseModel.ts"
          line: 21
          text: "    total: number;"
  - title: "Keyword broadening order"
    id: BLK-8
    decision_id: DEC-22
    owner: product
    owner_account_id: "replay-owner:product"
    ask: "For each keyword set, in what order should keywords be removed before the Default set is used?"
    detail:
      state: "The ticket requires dropping the narrowest keywords first but does not rank the keywords or define equal-priority and stopping behavior."
      options:
        - "Provide an explicit removal order for every feature keyword set."
        - "Remove keywords from the end of each listed set until the threshold is met."
        - "Skip incremental removal and move directly to the Default set."
      evidence:
        - kind: quote
          text: "If a seeded query returns no or very few results, gracefully broaden (drop the narrowest keywords, then fall back to the Default set) rather than showing an empty screen."
          source: description
conflicts: []
